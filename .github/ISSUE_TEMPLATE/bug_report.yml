name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Swiftea currently supports Ember Mug 2. Do not share full serial numbers, private logs, or sensitive local paths.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect Swiftea to do?
    validations:
      required: true

  - type: input
    id: swiftea
    attributes:
      label: Swiftea version
      placeholder: "0.4.0"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.0"
    validations:
      required: true

  - type: input
    id: mug
    attributes:
      label: Mug model
      description: Include this when the problem involves a mug.
      placeholder: "Ember Mug 2, 14 oz"

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add screenshots or extra context if useful. Review them for private information before posting.
