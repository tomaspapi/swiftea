name: Swiftea

options:
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: 2.9.1

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.tom.swiftea
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Swiftea
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Swiftea uses Bluetooth to find and control your Ember Mug 2.
    INFOPLIST_KEY_NSHumanReadableCopyright: Public domain via Zero-Clause BSD (0BSD) License
    INFOPLIST_KEY_SUEnableAutomaticChecks: YES
    INFOPLIST_KEY_SUAllowsAutomaticUpdates: NO
    INFOPLIST_KEY_SUFeedURL: $(SWIFTEA_UPDATE_FEED_URL)
    INFOPLIST_KEY_SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFTEA_UPDATE_FEED_URL: ""
    SPARKLE_PUBLIC_ED_KEY: ""
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES

targets:
  Swiftea:
    type: application
    platform: macOS
    supportedDestinations: [macOS]
    productName: Swiftea
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: Sources/Swiftea
      - path: Resources/AppIcon.icon
        buildPhase: resources
      - path: CHANGELOG.md
        buildPhase: resources
      - path: Resources/ThirdPartyNotices
        buildPhase: resources
    dependencies:
      - package: Sparkle
        product: Sparkle

  SwifteaTests:
    type: bundle.unit-test
    platform: macOS
    supportedDestinations: [macOS]
    productName: SwifteaTests
    sources:
      - path: Tests/SwifteaTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tom.swiftea.tests
    dependencies:
      - target: Swiftea
