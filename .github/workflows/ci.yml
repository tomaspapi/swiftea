name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Swift tests
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          for xcode in \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.5_beta.app \
            /Applications/Xcode.app
          do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode/Contents/Developer"
              break
            fi
          done

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test --scratch-path "$RUNNER_TEMP/swiftea-swiftpm-build"
